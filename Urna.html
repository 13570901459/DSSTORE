<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Urna Eletrônica - Horizontal Tela Cheia</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #1a252f;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .container-principal {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2vh 2vw;
            position: relative;
        }

        /* URNA EM TELA CHEIA HORIZONTAL */
        .urna {
            background-color: #dbd5c9;
            width: 96vw;
            height: 92vh;
            border-radius: 20px;
            display: flex;
            flex-direction: row;
            padding: 25px;
            gap: 25px;
            box-shadow: 0px 15px 35px rgba(0,0,0,0.6);
            border: 6px solid #b5af9f;
        }

        /* TELA */
        .tela {
            flex: 1.4;
            height: 100%;
            background: linear-gradient(135deg, #edf2f4, #8d99ae);
            border: 5px solid #333;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .tela-topo {
            font-size: 1.6vw;
            font-weight: bold;
            color: #222;
        }

        .cargo {
            text-align: center;
            font-size: 2.2vw;
            font-weight: 900;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .numeros-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            font-size: 1.8vw;
            font-weight: bold;
        }

        .numero-caixa {
            width: 4.5vw;
            height: 6vw;
            border: 3px solid #000;
            font-size: 3.5vw;
            font-weight: bold;
            text-align: center;
            line-height: 5.8vw;
            background-color: #fff;
        }

        .pisca {
            animation: piscar 1s infinite;
        }

        @keyframes piscar {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        .detalhes-candidato {
            margin-top: 20px;
            font-size: 1.8vw;
            line-height: 1.5;
        }

        .foto-candidato {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 14vw;
            height: 18vw;
            border: 3px solid #000;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
        }

        .foto-candidato img {
            width: 100%;
            height: 15vw;
            object-fit: cover;
        }

        .foto-candidato span {
            font-size: 1vw;
            text-align: center;
            font-weight: bold;
            line-height: 3vw;
        }

        .instrucoes {
            border-top: 3px solid #000;
            padding-top: 10px;
            font-size: 1.2vw;
            font-weight: bold;
        }

        .fim-tela {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 12vw;
            font-weight: 900;
            color: #000;
            letter-spacing: 5px;
        }

        /* TECLADO */
        .teclado {
            flex: 1;
            height: 100%;
            background-color: #222;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .teclado-numeros {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 75%;
            justify-content: center;
        }

        .teclado-linha {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn-num {
            background: linear-gradient(180deg, #333, #111);
            color: #fff;
            flex: 1;
            max-width: 90px;
            height: 7vh;
            font-size: 2vw;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0px 4px 0px #000;
        }

        .btn-num:active {
            transform: translateY(3px);
            box-shadow: 0px 1px 0px #000;
        }

        .teclado-acoes {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            height: 20%;
            align-items: flex-end;
        }

        .btn-acao {
            flex: 1;
            height: 8vh;
            font-size: 1.1vw;
            font-weight: 900;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0px 4px 0px rgba(0,0,0,0.5);
        }

        .btn-acao:active {
            transform: translateY(3px);
            box-shadow: 0px 1px 0px rgba(0,0,0,0.5);
        }

        .btn-branco { background-color: #ffffff; color: #000; }
        .btn-corrige { background-color: #e67e22; color: #000; }
        .btn-confirma { background-color: #27ae60; color: #000; height: 9.5vh; }

        /* ALERTA BRINCADEIRA */
        .alerta-brincadeira {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(192, 57, 43, 0.98);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            font-weight: bold;
            z-index: 10;
        }

        /* BOTÃO TELA CHEIA */
        .btn-fullscreen {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #27ae60;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            z-index: 99;
            opacity: 0.7;
        }
        .btn-fullscreen:hover { opacity: 1; }
    </style>
</head>
<body>

    <button class="btn-fullscreen" onclick="toggleFullscreen()">🗔 Tela Cheia</button>

    <div class="container-principal">
        <div class="urna">
            <div class="tela" id="tela"></div>

            <div class="teclado">
                <div class="teclado-numeros">
                    <div class="teclado-linha">
                        <button class="btn-num" onclick="clicou('1')">1</button>
                        <button class="btn-num" onclick="clicou('2')">2</button>
                        <button class="btn-num" onclick="clicou('3')">3</button>
                    </div>
                    <div class="teclado-linha">
                        <button class="btn-num" onclick="clicou('4')">4</button>
                        <button class="btn-num" onclick="clicou('5')">5</button>
                        <button class="btn-num" onclick="clicou('6')">6</button>
                    </div>
                    <div class="teclado-linha">
                        <button class="btn-num" onclick="clicou('7')">7</button>
                        <button class="btn-num" onclick="clicou('8')">8</button>
                        <button class="btn-num" onclick="clicou('9')">9</button>
                    </div>
                    <div class="teclado-linha">
                        <button class="btn-num" onclick="clicou('0')">0</button>
                    </div>
                </div>
                <div class="teclado-acoes">
                    <button class="btn-acao btn-branco" onclick="branco()">BRANCO</button>
                    <button class="btn-acao btn-corrige" onclick="corrige()">CORRIGE</button>
                    <button class="btn-acao btn-confirma" onclick="confirma()">CONFIRMA</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Foto do Lula
        const fotoLula = "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f4/Lula_-_foto_oficial_05_jan_2023_%28cropped%29.jpg/300px-Lula_-_foto_oficial_05_jan_2023_%28cropped%29.jpg";

        const candidatos = {
            "13": {
                nome: "LULA",
                partido: "PT",
                foto: fotoLula
            }
        };

        let numeroDigitado = "";
        let votoEmBranco = false;
        let bloqueado = false;

        // SISTEMA DE ÁUDIO REALISTA (Sintetizador Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Som de tecla (Beep curto)
        function tocarSomTeclado() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        // Som "PILILIM" clássico da Urna ao confirmar voto
        function tocarSomPililim() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const t = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc1.type = 'sine';
            osc2.type = 'sine';

            // Primeira nota (G5)
            osc1.frequency.setValueAtTime(783.99, t);
            // Segunda nota (C6 - mais aguda)
            osc2.frequency.setValueAtTime(1046.50, t + 0.15);

            gain.gain.setValueAtTime(0.25, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.7);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(audioCtx.destination);

            osc1.start(t);
            osc1.stop(t + 0.15);
            
            osc2.start(t + 0.15);
            osc2.stop(t + 0.7);
        }

        function atualizarTela() {
            const tela = document.getElementById("tela");

            if (votoEmBranco) {
                tela.innerHTML = `
                    <div class="tela-topo">SEU VOTO VAI PARA</div>
                    <div class="cargo">PRESIDENTE</div>
                    <div style="font-size: 3vw; text-align: center; margin-top: 40px; font-weight: bold;">VOTO EM BRANCO</div>
                    <div class="instrucoes">
                        Aperte a tecla:<br/>
                        <strong>VERDE</strong> para CONFIRMAR<br/>
                        <strong>VERMELHO</strong> para REINICIAR
                    </div>
                `;
                return;
            }

            let num1 = numeroDigitado[0] || "";
            let num2 = numeroDigitado[1] || "";
            let pisca1 = numeroDigitado.length === 0 ? "pisca" : "";
            let pisca2 = numeroDigitado.length === 1 ? "pisca" : "";

            let cand = candidatos[numeroDigitado];

            let htmlDetalhes = "";
            let htmlFoto = "";

            if (cand) {
                htmlDetalhes = `
                    <div class="detalhes-candidato">
                        Nome: <strong>${cand.nome}</strong><br/>
                        Partido: <strong>${cand.partido}</strong>
                    </div>
                `;
                htmlFoto = `
                    <div class="foto-candidato">
                        <img src="${cand.foto}" alt="Foto Lula">
                        <span>PRESIDENTE</span>
                    </div>
                `;
            } else if (numeroDigitado.length === 2) {
                htmlDetalhes = `
                    <div class="detalhes-candidato" style="margin-top:20px;">
                        <strong>VOTO NULO</strong>
                    </div>
                `;
            }

            tela.innerHTML = `
                <div class="tela-topo">SEU VOTO VAI PARA</div>
                <div class="cargo">PRESIDENTE</div>
                <div class="numeros-container">
                    <span>Número:</span>
                    <div class="numero-caixa ${pisca1}">${num1}</div>
                    <div class="numero-caixa ${pisca2}">${num2}</div>
                </div>
                ${htmlDetalhes}
                ${htmlFoto}
                <div class="instrucoes">
                    Aperte a tecla:<br/>
                    <strong>VERDE</strong> para CONFIRMAR<br/>
                    <strong>VERMELHO</strong> para REINICIAR
                </div>
            `;
        }

        function clicou(num) {
            if (bloqueado || votoEmBranco) return;
            if (numeroDigitado.length < 2) {
                tocarSomTeclado();
                numeroDigitado += num;
                atualizarTela();
            }
        }

        function branco() {
            if (bloqueado) return;
            tocarSomTeclado();
            votoEmBranco = true;
            numeroDigitado = "";
            atualizarTela();
        }

        function corrige() {
            if (bloqueado) return;
            tocarSomTeclado();
            votoEmBranco = false;
            numeroDigitado = "";
            atualizarTela();
        }

        function confirma() {
            if (bloqueado) return;

            // BRINCADEIRA DO 22
            if (numeroDigitado === "22") {
                tocarSomTeclado();
                bloqueado = true;

                const tela = document.getElementById("tela");
                tela.innerHTML += `
                    <div class="alerta-brincadeira">
                        <h2 style="font-size: 2.8vw; margin-bottom: 15px;">⚠️ RECONTAGEM AUTOMÁTICA! ⚠️</h2>
                        <p style="font-size: 1.8vw;">Erro no 22 detectado pelo sistema...</p>
                        <p style="font-size: 2.2vw; margin-top: 15px; color: #f1c40f;">Redirecionando voto para LULA (13)...</p>
                    </div>
                `;

                setTimeout(() => {
                    numeroDigitado = "13";
                    bloqueado = false;
                    atualizarTela();
                    finalizarVoto();
                }, 2200);

            } else if (numeroDigitado.length === 2 || votoEmBranco) {
                finalizarVoto();
            }
        }

        function finalizarVoto() {
            bloqueado = true;
            tocarSomPililim(); // Toca o som "PILILIM"
            const tela = document.getElementById("tela");
            tela.innerHTML = `<div class="fim-tela">FIM</div>`;

            setTimeout(() => {
                bloqueado = false;
                votoEmBranco = false;
                numeroDigitado = "";
                atualizarTela();
            }, 3500);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Inicializa a tela ao carregar
        atualizarTela();
    </script>
</body>
</html>
